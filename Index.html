<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fährten Tracker</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #7CB342; /* Das Grün aus den Screenshots */
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }

        .view {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .view.active {
            display: flex;
            flex-direction: column;
        }

        /* Karten Ansicht */
        #map-view { padding: 0; position: relative; }
        #map { height: 100%; width: 100%; }
        
        .map-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 30px;
            display: flex;
            gap: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            align-items: center;
        }

        .tracking-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 20px auto;
            display: block;
            cursor: pointer;
        }

        .tracking-btn.active {
            background-color: #d32f2f; /* Rot für Stopp */
        }

        /* Formulare & Listen (Details, Untergrund, Einstellungen) */
        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .input-group input, .input-group textarea, .input-group select {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #444;
            color: var(--text-main);
            padding: 8px 0;
            font-size: 1rem;
            outline: none;
        }

        .input-group input:focus {
            border-bottom-color: var(--primary);
        }

        /* Bottom Navigation */
        .bottom-nav {
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 20px 0;
            border-top: 1px solid #333;
        }

        .nav-item {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.8rem;
            cursor: pointer;
            flex: 1;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <header id="header-title">GPS-Tracking</header>

    <div id="view-map" class="view active">
        <div id="map"></div>
        <div class="map-overlay" id="stats-overlay" style="display: none;">
            <div id="dist-display">0.00 m</div>
            <div id="time-display">00:00</div>
        </div>
        <button id="track-btn" class="tracking-btn" style="position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 1000;">Fährte aufnehmen</button>
    </div>

    <div id="view-details" class="view">
        <div class="card">
            <div class="input-group">
                <label>Fährtenname</label>
                <input type="text" value="Anfängerfährte">
            </div>
            <div class="input-group">
                <label>Ort</label>
                <input type="text" placeholder="Ort eingeben">
            </div>
            <div class="input-group">
                <label>Länge (wird automatisch berechnet)</label>
                <input type="text" id="detail-length" value="0 m" readonly>
            </div>
            <div class="input-group">
                <label>Anzahl Gegenstände</label>
                <input type="number" value="3">
            </div>
        </div>
        <div class="card">
            <div class="input-group">
                <label>Persönliche Notizen</label>
                <textarea rows="3" placeholder="Notizen zur Fährte..."></textarea>
            </div>
        </div>
    </div>

    <div id="view-surface" class="view">
        <div class="card">
            <div class="input-group">
                <label>Bodenbeschaffenheit</label>
                <select>
                    <option>Wiese</option>
                    <option>Wald</option>
                    <option>Straße</option>
                    <option>Hohes Gras</option>
                    <option>Saatfeld</option>
                </select>
            </div>
        </div>
        <div class="card">
            <div class="input-group">
                <label>Bedingungen</label>
                <select>
                    <option>Trocken</option>
                    <option>Nass</option>
                    <option>Schnee</option>
                    <option>Unbekannt</option>
                </select>
            </div>
        </div>
    </div>

    <div id="view-settings" class="view">
        <div class="card">
            <div class="input-group">
                <label>Kartentyp</label>
                <select id="map-type">
                    <option value="street">Standard</option>
                    <option value="topo">Topografisch</option>
                </select>
            </div>
            <div class="input-group">
                <label>Maßeinheit</label>
                <select>
                    <option>Metrisch (Meter)</option>
                </select>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchView('map', 'GPS-Tracking', this)">
            <span class="nav-icon">🗺️</span>
            Karte
        </div>
        <div class="nav-item" onclick="switchView('details', 'Trainingsdaten', this)">
            <span class="nav-icon">📄</span>
            Details
        </div>
        <div class="nav-item" onclick="switchView('surface', 'Beschaffenheit', this)">
            <span class="nav-icon">🐾</span>
            Untergrund
        </div>
        <div class="nav-item" onclick="switchView('settings', 'Einstellungen', this)">
            <span class="nav-icon">⚙️</span>
            Einstellungen
        </div>
    </div>

    <script>
        // UI Logik: Zwischen Ansichten wechseln
        function switchView(viewName, title, element) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('view-' + viewName).classList.add('active');
            element.classList.add('active');
            document.getElementById('header-title').innerText = title;

            // Karte neu ausrichten, wenn sie eingeblendet wird
            if(viewName === 'map' && map) {
                setTimeout(() => map.invalidateSize(), 100);
            }
        }

        // GPS und Karten Logik
        let map, polyline;
        let watchId = null;
        let positions = [];
        let totalDistance = 0; // in Metern
        let startTime = null;
        let timerInterval = null;

        // Karte initialisieren
        function initMap() {
            map = L.map('map').setView([51.165, 10.451], 6); // Startansicht Deutschland
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            polyline = L.polyline([], {color: '#7CB342', weight: 5}).addTo(map);
            
            // Eigenen Standort suchen
            map.locate({setView: true, maxZoom: 16});
        }

        // Haversine-Formel zur Distanzberechnung zwischen zwei Koordinaten
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Erdradius in Metern
            const p1 = lat1 * Math.PI/180;
            const p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180;
            const dl = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(dp/2) * Math.sin(dp/2) +
                      Math.cos(p1) * Math.cos(p2) *
                      Math.sin(dl/2) * Math.sin(dl/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Timer formatieren
        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return [h, m > 9 ? m : h ? '0' + m : m || '0', s > 9 ? s : '0' + s].filter(Boolean).join(':');
        }

        // Tracking starten / stoppen
        const trackBtn = document.getElementById('track-btn');
        const statsOverlay = document.getElementById('stats-overlay');
        
        trackBtn.addEventListener('click', () => {
            if (!watchId) {
                // STARTE TRACKING
                if (!navigator.geolocation) {
                    alert("GPS wird von deinem Browser nicht unterstützt.");
                    return;
                }
                
                trackBtn.innerText = "Fährte stoppen";
                trackBtn.classList.add('active');
                statsOverlay.style.display = 'flex';
                
                positions = [];
                totalDistance = 0;
                polyline.setLatLngs([]);
                startTime = Date.now();

                // Timer starten
                timerInterval = setInterval(() => {
                    const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                    document.getElementById('time-display').innerText = formatTime(elapsedSeconds);
                }, 1000);

                // GPS Position kontinuierlich abfragen
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const newPos = [lat, lng];
                        
                        if (positions.length > 0) {
                            const lastPos = positions[positions.length - 1];
                            totalDistance += calculateDistance(lastPos[0], lastPos[1], lat, lng);
                        }
                        
                        positions.push(newPos);
                        polyline.addLatLng(newPos);
                        map.panTo(newPos);
                        
                        document.getElementById('dist-display').innerText = totalDistance.toFixed(2) + " m";
                        document.getElementById('detail-length').value = totalDistance.toFixed(2) + " m";
                    },
                    (error) => {
                        console.error("GPS Fehler:", error);
                    },
                    { enableHighAccuracy: true, maximumAge: 0 }
                );

            } else {
                // STOPPE TRACKING
                trackBtn.innerText = "Fährte aufnehmen";
                trackBtn.classList.remove('active');
                navigator.geolocation.clearWatch(watchId);
                clearInterval(timerInterval);
                watchId = null;
            }
        });

        // Beim Start Karte laden
        window.onload = initMap;
    </script>
</body>
</html>
