<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fährten Tracker</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --primary: #7CB342; --text-main: #ffffff; --text-muted: #aaaaaa; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background-color: var(--card-bg); padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center;}
        .save-btn { background-color: var(--primary); color: white; border: none; padding: 5px 15px; border-radius: 15px; font-weight: bold; }
        .view { display: none; flex: 1; overflow-y: auto; padding: 15px; }
        .view.active { display: flex; flex-direction: column; }
        #map-view { padding: 0; position: relative; }
        #map { height: 100%; width: 100%; }
        .map-overlay { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: var(--card-bg); padding: 10px 20px; border-radius: 30px; display: flex; gap: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); align-items: center; }
        .tracking-btn { background-color: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 25px; font-size: 1.1rem; font-weight: bold; position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 1000; cursor: pointer; }
        .tracking-btn.active { background-color: #d32f2f; }
        .card { background-color: var(--card-bg); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
        .input-group input, .input-group textarea, .input-group select { width: 100%; background: transparent; border: none; border-bottom: 1px solid #444; color: var(--text-main); padding: 8px 0; font-size: 1rem; outline: none; }
        .input-group input:focus { border-bottom-color: var(--primary); }
        .btn-small { background-color: #333; color: white; border: 1px solid #555; padding: 8px 15px; border-radius: 5px; margin-top: 5px; width: 100%; }
        .history-item { background: #2a2a2a; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--primary); }
        .history-title { font-weight: bold; margin-bottom: 5px; }
        .history-details { font-size: 0.85rem; color: var(--text-muted); }
        .bottom-nav { background-color: var(--card-bg); display: flex; justify-content: space-around; padding: 10px 0 20px 0; border-top: 1px solid #333; }
        .nav-item { color: var(--text-muted); text-align: center; font-size: 0.75rem; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 1.4rem; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>
    <header>
        <span id="header-title">GPS-Tracking</span>
        <button class="save-btn" onclick="saveTrack()" style="display: none;" id="header-save-btn">Speichern</button>
    </header>

    <div id="view-map" class="view active">
        <div id="map"></div>
        <div class="map-overlay" id="stats-overlay" style="display: none;">
            <div id="dist-display">0 m</div>
            <div id="time-display">00:00</div>
        </div>
        <button id="track-btn" class="tracking-btn">Fährte aufnehmen</button>
    </div>

    <div id="view-details" class="view">
        <div class="card">
            <div class="input-group">
                <label>Fährtenname</label>
                <input type="text" id="track-name" value="Anfängerfährte">
            </div>
            <div class="input-group">
                <label>Länge & Dauer</label>
                <input type="text" id="detail-stats" value="0 m / 00:00" readonly>
            </div>
        </div>
        <div class="card">
            <div class="input-group">
                <label>Liegezeit (Wie lange liegt die Fährte schon?)</label>
                <div style="font-size: 1.2rem; font-weight: bold; margin-bottom: 10px;" id="liegezeit-display">00:00:00</div>
                <button class="btn-small" onclick="startLiegezeit()">Fährte jetzt gelegt (Start)</button>
            </div>
        </div>
        <div class="card">
            <div class="input-group">
                <label>Gegenstände fotografieren</label>
                <input type="file" accept="image/*" capture="environment" multiple style="border: none;">
            </div>
        </div>
        <div class="card">
            <div class="input-group">
                <label>Persönliche Notizen</label>
                <textarea id="track-notes" rows="3" placeholder="Notizen zur Fährte..."></textarea>
            </div>
        </div>
    </div>

    <div id="view-surface" class="view">
        <div class="card">
            <div class="input-group">
                <label>Bodenbeschaffenheit</label>
                <select id="track-surface">
                    <option>Wiese</option>
                    <option>Wald</option>
                    <option>Straße</option>
                    <option>Saatfeld</option>
                </select>
            </div>
        </div>
    </div>

    <div id="view-history" class="view">
        <div class="card">
            <h3 style="margin-bottom: 10px;">Gespeicherte Fährten</h3>
            <div id="history-list"><p style="color: var(--text-muted); font-size: 0.9rem;">Noch keine Fährten gespeichert.</p></div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchView('map', 'GPS-Tracking', this)"><span class="nav-icon">🗺️</span> Karte</div>
        <div class="nav-item" onclick="switchView('details', 'Trainingsdaten', this)"><span class="nav-icon">📄</span> Details</div>
        <div class="nav-item" onclick="switchView('surface', 'Beschaffenheit', this)"><span class="nav-icon">🐾</span> Boden</div>
        <div class="nav-item" onclick="switchView('history', 'Historie', this)"><span class="nav-icon">🗃️</span> Historie</div>
    </div>

    <script>
        function switchView(viewName, title, element) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + viewName).classList.add('active');
            element.classList.add('active');
            document.getElementById('header-title').innerText = title;
            document.getElementById('header-save-btn').style.display = (viewName === 'details') ? 'block' : 'none';
            if(viewName === 'map' && map) setTimeout(() => map.invalidateSize(), 100);
            if(viewName === 'history') loadHistory();
        }

        let liegezeitStart = null, liegezeitInterval = null;
        function startLiegezeit() {
            liegezeitStart = Date.now();
            if(liegezeitInterval) clearInterval(liegezeitInterval);
            liegezeitInterval = setInterval(() => {
                const diff = Math.floor((Date.now() - liegezeitStart) / 1000);
                const h = String(Math.floor(diff / 3600)).padStart(2, '0');
                const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
                const s = String(diff % 60).padStart(2, '0');
                document.getElementById('liegezeit-display').innerText = `${h}:${m}:${s}`;
            }, 1000);
        }

        function saveTrack() {
            const trackData = {
                name: document.getElementById('track-name').value,
                stats: document.getElementById('detail-stats').value,
                surface: document.getElementById('track-surface').value,
                date: new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute:'2-digit' })
            };
            let history = JSON.parse(localStorage.getItem('faehrtenHistory')) || [];
            history.unshift(trackData);
            localStorage.setItem('faehrtenHistory', JSON.stringify(history));
            alert("Fährte lokal gespeichert!");
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('faehrtenHistory')) || [];
            const list = document.getElementById('history-list');
            if(history.length === 0) { list.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Noch keine Fährten gespeichert.</p>'; return; }
            list.innerHTML = '';
            history.forEach(track => {
                list.innerHTML += `<div class="history-item"><div class="history-title">${track.name}</div><div class="history-details">🗓️ ${track.date}</div><div class="history-details">📏 ${track.stats} | 🐾 ${track.surface}</div></div>`;
            });
        }

        let map, polyline, watchId = null, positions = [], totalDistance = 0, startTime = null, timerInterval = null;

        function initMap() {
            map = L.map('map').setView([51.165, 10.451], 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OS' }).addTo(map);
            polyline = L.polyline([], {color: '#7CB342', weight: 5}).addTo(map);
            map.locate({setView: true, maxZoom: 16});
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        const trackBtn = document.getElementById('track-btn');
        trackBtn.addEventListener('click', () => {
            if (!watchId) {
                if (!navigator.geolocation) { alert("GPS nicht unterstützt."); return; }
                trackBtn.innerText = "Fährte stoppen"; trackBtn.classList.add('active');
                document.getElementById('stats-overlay').style.display = 'flex';
                positions = []; totalDistance = 0; polyline.setLatLngs([]); startTime = Date.now();
                timerInterval = setInterval(() => {
                    const sec = Math.floor((Date.now() - startTime) / 1000);
                    const m = String(Math.floor(sec / 60)).padStart(2, '0');
                    const s = String(sec % 60).padStart(2, '0');
                    const timeStr = `${m}:${s}`;
                    document.getElementById('time-display').innerText = timeStr;
                    document.getElementById('detail-stats').value = `${totalDistance.toFixed(0)} m / ${timeStr}`;
                }, 1000);
                watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const lat = pos.coords.latitude, lng = pos.coords.longitude;
                        if (positions.length > 0) totalDistance += calculateDistance(positions[positions.length-1][0], positions[positions.length-1][1], lat, lng);
                        positions.push([lat, lng]); polyline.addLatLng([lat, lng]); map.panTo([lat, lng]);
                        document.getElementById('dist-display').innerText = totalDistance.toFixed(0) + " m";
                    },
                    (err) => console.error(err),
                    { enableHighAccuracy: true, maximumAge: 0 }
                );
            } else {
                trackBtn.innerText = "Fährte aufnehmen"; trackBtn.classList.remove('active');
                navigator.geolocation.clearWatch(watchId); clearInterval(timerInterval); watchId = null;
            }
        });
        window.onload = initMap;
    </script>
</body>
</html>
